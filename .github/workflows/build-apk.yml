name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de Build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Setup Node ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      # ─── Setup Java 21 ───
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ─── Install dependencies ───
      - name: Install dependencies
        run: npm ci

      # ─── Build web app ───
      - name: Build web app
        run: npm run build

      # ─── Sync Capacitor ───
      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap update android

      # ─── Decode Keystore ───
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/turnos-keystore.jks
            echo "KEYSTORE_FILE=turnos-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_DECODED=true" >> $GITHUB_ENV
          fi

      # ─── Build Debug APK ───
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ─── Build Release APK (signed) ───
      - name: Build Release APK
        if: env.KEYSTORE_DECODED == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # ─── Build Release AAB (Android App Bundle) ───
      - name: Build Release AAB
        if: env.KEYSTORE_DECODED == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      # ─── Upload Debug APK ───
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TurnosApp-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      # ─── Upload Release APK (signed) ───
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TurnosApp-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      # ─── Upload Release AAB ───
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: TurnosApp-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      # ─── Publish APK como Release descargable desde el repo ───
      - name: Prepare release files
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/TurnosApp-Debug.apk || true
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/TurnosApp-Release.apk || true
          cp android/app/build/outputs/bundle/release/app-release.aab release-assets/TurnosApp-Release.aab || true

      - name: Publish GitHub Release (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 📱 TurnosApp — APK para Android
          body: |
            Última versión generada automáticamente desde `main`.

            **Descargas:**
            - **`TurnosApp-Debug.apk`** — para instalar y probar en el teléfono
            - `TurnosApp-Release.apk` — firmada (si está configurado el keystore)
            - `TurnosApp-Release.aab` — para Google Play Store (si está configurado el keystore)

            > En Android permite "instalar desde orígenes desconocidos". Este archivo se
            > actualiza en cada push a `main` (etiqueta fija `apk-latest`).
          files: release-assets/*
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
